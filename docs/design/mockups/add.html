<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recipe Rolodex: add-recipe mockup</title>
  <link rel="stylesheet" href="mockup.css">
</head>
<body>
  <main class="page page--narrow">
    <nav class="topbar">
      <a class="back-link" href="index.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
        Back to the box
      </a>
      <span class="topbar__brand">Recipe Rolodex</span>
    </nav>

    <form class="form-card">
      <header class="form-card__head">
        <h1 class="form-card__title">A new card for the box</h1>
        <p class="tagline">fill it in, and it'll be filed once you approve it</p>
      </header>

      <div class="form-card__body">
        <div class="field">
          <label class="label" for="title">Title</label>
          <input class="input input--title" id="title" type="text" value="Grandma's Banana Bread">
          <span class="hint">Saved as <strong>grandmas-banana-bread</strong></span>
        </div>

        <div class="field-row">
          <div class="field"><label class="label" for="serves">Serves</label><input class="input" id="serves" type="number" value="8"></div>
          <div class="field"><label class="label" for="prep">Prep time</label><input class="input" id="prep" type="text" value="15 min"></div>
          <div class="field"><label class="label" for="cook">Cook time</label><input class="input" id="cook" type="text" value="1 hr"></div>
        </div>

        <div class="field-row" style="--min: 260px">
          <div class="field"><label class="label" for="tags">Tags</label><input class="input" id="tags" type="text" value="baking, breakfast"></div>
          <div class="field"><label class="label" for="source">Source</label><input class="input" id="source" type="text" placeholder="Grandma, or a link" value="Grandma"></div>
        </div>

        <div class="field">
          <span class="label">Cover photo</span>
          <label class="dropzone" for="photo">
            <span class="dropzone__thumb"><span class="photo-placeholder"></span></span>
            <span class="field">
              <strong>Take a photo or choose one</strong>
              <span class="hint">Shrunk to 1600px WebP, about 280 KB</span>
            </span>
            <input class="visually-hidden" id="photo" type="file" accept="image/*">
          </label>
        </div>

        <div class="field">
          <label class="label" for="ingredients">Ingredients, one per line</label>
          <textarea class="textarea ruled" id="ingredients" rows="6">3 very ripe bananas, mashed
1/3 cup melted butter
3/4 cup sugar
1 egg, beaten
1 tsp vanilla extract</textarea>
        </div>

        <div class="field">
          <label class="label" for="steps">Steps, one per line</label>
          <textarea class="textarea ruled" id="steps" rows="5">Heat the oven to 350°F and butter a 4x8 loaf pan.
Mash the bananas, then stir in the melted butter.
Mix in the baking soda and salt, then the sugar, egg and vanilla.</textarea>
        </div>

        <div class="form-actions">
          <span class="hint">Sent to GitHub as a pull request. It goes live once you merge it.</span>
          <button class="btn" type="submit">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l5 5L20 6"/></svg>
            File this card
          </button>
        </div>
      </div>
    </form>
  </main>
</body>
</html>
